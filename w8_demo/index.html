<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W8 Demo | Data Structures in JS</title>
</head>
<body>
    
    <h1>Week 8 Demo | JavaScript Arrays and Objects</h1>

    <div id="output">
        <!--We will use JS to write data in here!-->
    </div>

    <!--In-document JavaScript BELOW-->
    <script>

        //arrays------------------------------

        var people = [
            `Katie`,
            `Tyler`,
            `Ethan`
        ]

        console.log(`${people}`) //log the entire collection of data
        console.log(`${people[0]}`) //one value within array
        //arrayName[index] ---> name + key = value
        console.log(`${people.length}`) //array property length --> num of items in array
        console.log(`${people[people.length - 1]}`) //last value in array

        var firstPerson = people[0]
        console.log(`${firstPerson}`) //matches log from line 28

        //add a person to the array without using index
        people.push(`Arman`)
        console.log(`${people}`)

        //get value from user to add to array
        people.push(prompt(`Enter a name to add to PEOPLE array: `))
        console.log(`${people}`)

        //parallel arrays-------------------------------
        var color = [
            `grey`,
            `red`,
            `green`,
            `red`,
            `neon beige`
        ]

        //var age = []

        for(let index = 0; index < people.length; index++)
        {
            //index++ --> index += 1 --> index = index + 1
            console.log(`${people[index]}'s favorite color is ${color[index]}!`)
            /*
            age.push(
                prompt(`How old is ${people[index]}?: `)
            )
            */
        }

        /*
        for(let index = 0; index < people.length; index++)
        {
            //index++ --> index += 1 --> index = index + 1
            console.log(`${people[index]} is ${age[index]} years old!`)
        }
        */

        //add our people and color data to the HTML page, div with id = output
        var output = document.querySelector(`#output`)

        for(let i = 0; i < people.length; i++)
        {
            output.innerHTML += `<p>${people[i]}'s favorite color is ${color[i]}!</p>`
        }

        //objects-------------------------
        var person1 = {
            first: `Ethan`,
            last: `Paul`,
            age: 19,
            pets: false,
            greeting: function(){
                alert(`Hello, from ${this.first}!`) //this references current object
            },
            classes: [`SE111`, `SE126`, `SE116`]
        }

        console.log(`${person1}`) //shows object and all properties
        console.dir(person1)
        console.log(`${person1.first}`) //shows just one property's value of the object
        person1.car = `Jeep` //adding a new property with value
        console.log(`${person1}`)

        //processing through all properties in an object
        for(let key in person1)
        {
            //for each key (property) in the object
            console.log(`${key}: ${person1[key]}`)
        }

        alert(`Watch what happens next!`) //this is a pause before the next line
        //call the object's function --> accessing a METHOD!
        person1.greeting()

        var person2 = {
            first: `Christopher`,
            last: `Tavarez`,
            age: 103,
            pets: false,
            greeting: function(){
                alert(`Hello, from ${this.first}!`) //this references current object
            },
            classes: [`SE111`, `AI240`, `BA110`]
        }

        for(let key in person2)
        {
            //for each key (property) in the object
            console.log(`${key}: ${person2[key]}`)
        }

        //putting it all together --> a data structure populated with other data structures
        //array of objects --> array is outer structure, objects are the inner structure
        var humans = [
            person1, //i = 0
            person2 //i = 1
        ]

        var newOutput = ``

        for(let i = 0; i < humans.length; i++)
        {
            //this loop controls the array data (which object are we looking at?)
            newOutput += `<h3>INFO FOR: ${humans[i].first}: </h3>`

            for(let key in humans[i])
            {
                //this inner loop controls each property within the current object of the array
                newOutput += `<p><b>${key}:</b> ${humans[i][key]}</p>`
            }

            newOutput += `<hr>`
        }


        //write to the page
        document.querySelector(`#output`).innerHTML += newOutput
    </script>


</body>
</html>
